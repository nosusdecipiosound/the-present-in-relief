<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Present in Relief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2F7; --ink:#23307F; --soft:#C4E4F4; --text:#1B1F2E; --muted:#596077; --line:#C9D3E0; --on-ink:#F4F7FB; --ink-dim:#7C86B8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#10152C;--ink:#9FB0FF;--soft:#24315C;--text:#E6EAF5;--muted:#9AA3BD;--line:#2C3659;--on-ink:#10152C;--ink-dim:#5A6699}
}
:root[data-theme="dark"]{--bg:#10152C;--ink:#9FB0FF;--soft:#24315C;--text:#E6EAF5;--muted:#9AA3BD;--line:#2C3659;--on-ink:#10152C;--ink-dim:#5A6699}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Newsreader",Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:1.125rem;line-height:1.6;-webkit-font-smoothing:antialiased}
:lang(ja) body{line-height:1.85}
main{max-width:34rem;margin:0 auto;padding:1.25rem 1.375rem 3rem}
.top{display:flex;justify-content:flex-end;gap:.15rem}
.lang{background:none;border:0;color:var(--muted);font:inherit;font-size:1rem;padding:.35rem .55rem;border-radius:.4rem;cursor:pointer}
.lang[aria-pressed="true"]{color:var(--text);text-decoration:underline;text-underline-offset:.3em}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
h1{font-weight:500;font-size:clamp(2.2rem,10vw,3.2rem);line-height:1.05;letter-spacing:-.02em;margin:.5rem 0 .4rem}
.ded{font-style:italic;color:var(--muted);font-size:1rem;margin:1.2rem 0 0}
.sub{font-style:italic;color:var(--muted);margin:0 0 .4rem}
.composer{text-align:right;margin:0 0 1.8rem;letter-spacing:.04em}
:lang(ja) .sub{font-style:normal}
/* the instrument */
.stage{display:flex;flex-direction:column;align-items:center;margin:.5rem 0 2rem}
.pad{--p:0;position:relative;width:min(72vw,17rem);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;
  background:conic-gradient(var(--ink) calc(var(--p)*1turn),var(--soft) 0);padding:0;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.pad .face{position:absolute;inset:7px;border-radius:50%;background:var(--ink);color:var(--on-ink);transition:background-color .9s ease, transform .12s ease-out;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.pad:active .face{transform:scale(.97)}
.pad .num{font-size:clamp(4rem,22vw,6rem);line-height:1;font-weight:500}
.pad .lbl{font-size:clamp(1.8rem,9vw,2.6rem);letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.pad.busy{cursor:default}
.pad .frag{display:none;height:78%;width:auto;max-width:64%}
.pad.busy .face{background:#fff}
.pad.busy .lbl{display:none}
.pad.busy .frag{display:block}
.pad .lbl{animation:fadein .9s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
:lang(ja) .pad .lbl{letter-spacing:.05em;text-transform:none}
.pad[disabled]{cursor:default;opacity:.45}
.ripple{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ink);pointer-events:none;animation:rip 1.1s ease-out forwards}
@keyframes rip{from{transform:scale(1);opacity:.7}to{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){.ripple{display:none}.pad .face{transition:none}}
.cue{margin:0 0 1.1rem;text-align:center;font-size:1.25rem;line-height:1.4;max-width:22rem}
.status{margin:1rem 0 0;color:var(--muted);font-size:1rem;min-height:1.6em;text-align:center}
.choose{margin:0 0 2rem}
.choose h2{font-size:1.1rem;font-weight:500;margin:0 0 .7rem}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.chip{height:3.4rem;border-radius:1.7rem;border:1px solid var(--line);background:none;color:var(--text);font:inherit;font-size:1.4rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
ol{margin:0;padding:0;list-style:none;counter-reset:s}
ol li{counter-increment:s;position:relative;padding:.85rem 0 .85rem 2.3rem;border-top:1px solid var(--line)}
ol li:last-child{border-bottom:1px solid var(--line)}
ol li::before{content:counter(s);position:absolute;left:0;top:.75rem;font-size:1.45rem;line-height:1.2;color:var(--ink);font-weight:500}
</style>
</head>
<body>
<main>
  <div class="top" role="group" aria-label="Language">
    <button class="lang" data-l="en">English</button>
    <button class="lang" data-l="sv">Svenska</button>
  </div>
  <p class="ded">dedicated to Satoko Inoue</p>
  <h1 id="title"></h1>
  <p class="sub">for Piano and Its Listeners</p>
  <p class="composer">Yohan KIM</p>


  <div class="stage">
    <p class="cue" data-t="cue"></p>
    <button class="pad" id="pad" disabled aria-describedby="status">
      <span class="face"><span class="lbl" data-t="random"></span><img class="frag" id="frag" alt=""></span>
    </button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <ol>
    <li data-t="s1"></li>
    <li data-t="s2"></li>
    <li data-t="s3"></li>
    <li data-t="s4"></li>
  </ol>
</main>

const $=id=>document.getElementById(id);
let lang=(navigator.language||"en").toLowerCase().startsWith("sv")?"sv":"en";
let statusKey="loading";
function setStatus(k){statusKey=k;$("status").textContent=T[lang][k]||"";}
function setLang(l){lang=l;document.documentElement.lang=l;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T[l][e.dataset.t]);
  document.querySelectorAll(".lang").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  setStatus(statusKey); setLabel();}
function setLabel(){ const l=document.querySelector(".pad .lbl"); if(l) l.textContent = part===0 ? T[lang].random : T[lang].part; }
document.querySelectorAll(".lang").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$("title").textContent=TITLE; document.title=TITLE;

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ctx=null, buffers={}, part=null, voices=[], wakeLock=null;
try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
if(AC) ctx=new AC();
function decode(ab){return new Promise((res,rej)=>{const p=ctx.decodeAudioData(ab,res,rej); if(p&&p.then)p.then(res,rej);});}
async function load(n){
  if(buffers[n])return buffers[n];
  const src=(window.EMBEDDED&&window.EMBEDDED[n])?window.EMBEDDED[n]:FILE(n);
  let ab;
  if(src.startsWith("data:")){            // embedded audio (preview): decode locally, no network request
    const bin=atob(src.slice(src.indexOf(",")+1)); const u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); ab=u.buffer;
  }else{ const r=await fetch(src); if(!r.ok)throw new Error(r.status); ab=await r.arrayBuffer(); }
  buffers[n]=await decode(ab); return buffers[n];
}
async function choose(n){          // n = 1..PARTS, or 0 = a random recording on every tap
  part=n; setLabel(); $("pad").disabled=true; setStatus("loading");
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",+c.dataset.n===n));
  try{
    if(n===0){ for(let k=1;k<=PARTS;k++) await load(k); } else await load(n);
    if(part===n){$("pad").disabled=false; setStatus("ready");}
  }catch(e){ if(part===n) setStatus("error"); }
}
async function keepAwake(){ try{ if("wakeLock" in navigator && !wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>wakeLock=null);} }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&ctx&&ctx.state!=="running") ctx.resume(); });

function play(){
  if(!ctx){alert(T[lang].noaudio);return}
  if(voices.length) return;                 // wait until the current recording has finished
  const which = part===0 ? 1+Math.floor(Math.random()*PARTS) : part;
  const buf=buffers[which]; if(!buf)return;
  $("frag").src=FRAG[which]; $("frag").alt="Fragment "+which; $("frag").style.opacity=1;
  ctx.resume(); keepAwake();
  if(!OVERLAP){ voices.forEach(v=>{try{v.src.stop()}catch(e){}}); voices=[]; }
  const src=ctx.createBufferSource(); src.buffer=buf; src.connect(ctx.destination);
  const v={src,t0:ctx.currentTime+.01,dur:buf.duration}; src.start(v.t0);
  src.onended=()=>{voices=voices.filter(x=>x!==v); if(!voices.length){setStatus("ready"); $("pad").classList.remove("busy"); $("pad").removeAttribute("aria-disabled");}};
  voices.push(v); setStatus("playing"); $("pad").classList.add("busy"); $("pad").setAttribute("aria-disabled","true");
  const r=document.createElement("span"); r.className="ripple"; $("pad").appendChild(r); setTimeout(()=>r.remove(),1200);
  if(!raf) raf=requestAnimationFrame(draw);
}
let raf=0;
function draw(){ // ring shows progress of the most recent playback
  const v=voices[voices.length-1];
  $("pad").style.setProperty("--p", v? Math.min(1,Math.max(0,(ctx.currentTime-v.t0)/v.dur)) : 0);
  if(v){ const left=v.t0+v.dur-ctx.currentTime; $("frag").style.opacity=Math.max(0,Math.min(1,left/FADE)); }
  raf = voices.length ? requestAnimationFrame(draw) : 0;
  if(!raf) $("pad").style.setProperty("--p",0);
}
$("pad").addEventListener("click",play);

/* ---------- no choice: every tap plays one of the four recordings at random (any ?part= in the URL is ignored) ---------- */
setLang(lang);
if(!AC){ setStatus("noaudio"); } else { choose(0); }
</script>
